[urteil]
backend = "claude"
modell = "sonnet"

[transkript]
backend = "mlx"
modell = "mlx-community/whisper-large-v3-turbo"
# In Fenstern von 12 bis 22 s hören statt am Stück: mehr Satzzeichen, weniger
# Verhörer. false schaltet zurück auf einen Lauf über die ganze Aufnahme.
fenster = true
# Ein Satz mit Satzzeichen und den Wörtern, die in deinen Aufnahmen oft
# vorkommen (Namen, Werkzeuge). Er hilft Whisper bei Schreibweise und Punkten.
prompt = "Heute geht es um KI, Claude Code und Automatisierung."

sprache = "de"
zeitzone = "Europe/Berlin"
gesamtzeit_minuten = 50

[ki]
# Monatlicher Hoechstbetrag fuer kostenpflichtige KI-Videos. LTX bleibt lokal und kostenlos.
deckel_eur = 20
# Eine kurze KI-Szene im Reel einsetzen. Erst bewusst einschalten, wenn LTX oder OpenRouter bereit ist.
einblendung = false
# Ordner der lokalen Installation von ltx-2-mlx. Leer lassen, wenn LTX nicht installiert ist.
ltx_ordner = ""

[schnitt]
min_laenge = 30
max_laenge = 170
# Zieht Wortanfänge nach einer längeren Sprechpause am tatsächlichen Toneinsatz nach.
wortanfang_nachziehen = true
pausen_ab = 0.9
entspiegeln = false
belichtung = true
# Ab hier: Werte von Team B (Rohschnitt/Fassungen), siehe pipeline/schnitt.py.
pause_ziel = 0.28
max_segment = 9.0
vorlauf = 0.14
nachlauf = 0.40
ausklang_max = 0.6
zoom_stufen = [1.0, 1.15]
augenlinie = 0.36
blende_segment = 0.12

[rechtschreibung]
an = true
dienst = "https://api.languagetool.org/v2/check"
# Wörter, die LanguageTool sonst als Fehler markiert, aber keine sind
# (eigene Begriffe, Produktnamen). Platt- und Werkzeugnamen sind schon fest
# eingebaut, siehe pipeline/rechtschreibung.py.
ausnahmen = []

[freigabe]
pauschal = false

[plan]
tage = 7

[kurzstuecke]
# Stille Zusatzreels je Aufnahme einzeln ein- oder ausschalten.
lesereel = true
uebermalt = true
# Je Format liegen höchstens so viele noch unveröffentlichte Zusatzstücke bereit.
vorrat_hoechstens = 2
# Zwischen zwei Lese-Reels oder zwei übermalten Sätzen je Kanal liegen mindestens so viele Kalendertage.
abstand_tage = 2

[ordner]
eingang = "eingang"
arbeit = "arbeit"
ausgabe = "ausgabe"

[eingang]
# Weitere Eingangsordner, zum Beispiel ein Ordner von Google Drive für Desktop. ~ ist erlaubt.
weitere_ordner = []
